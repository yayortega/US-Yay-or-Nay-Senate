<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>USA👍👎?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #121a2b;
      --border-color: rgba(255, 255, 255, 0.12);
      --red-color: #ff3b5c;
      --blue-color: #00d2ff;
      --yellow-color: #ffcc00;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      text-align: center;
      padding: 12px 0 4px;
    }

    /* RED, WHITE, AND BLUE USA TITLE */
    .main-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .usa-u { color: var(--red-color); }
    .usa-s { color: #ffffff; }
    .usa-a { color: var(--blue-color); }

    .title-icon {
      width: 32px;
      height: 32px;
      display: inline-block;
      vertical-align: middle;
    }

    .icon-up { fill: var(--blue-color); }
    .icon-down { fill: var(--red-color); }

    .subtitle {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
    }

    .gauge-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 16px 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .gauge-svg {
      width: 100%;
      height: auto;
      max-height: 290px;
      overflow: visible;
    }

    .arc-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 22;
      stroke-linecap: round;
    }

    /* UNIFIED GRADIENT ARC STYLING */
    .arc-gradient-fill {
      fill: none;
      stroke: url(#meterGradient);
      stroke-width: 22;
      stroke-linecap: round;
    }

    .tick-major {
      stroke: rgba(255, 255, 255, 0.8);
      stroke-width: 3;
    }

    .gauge-text-nay {
      fill: var(--red-color);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .gauge-text-yay {
      fill: var(--blue-color);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .majority-badge {
      fill: var(--yellow-color);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .majority-line {
      stroke: var(--yellow-color);
      stroke-width: 2;
      stroke-dasharray: 3, 3;
    }

    /* ELASTIC SPRING BOUNCE TRANSITION */
    .needle {
      stroke: var(--text-main);
      stroke-width: 4;
      stroke-linecap: round;
      transition: transform 0.6s cubic-bezier(0.34, 1.8, 0.64, 1);
      transform-origin: 150px 160px;
    }

    .needle-hub {
      fill: var(--yellow-color);
      stroke: var(--bg-color);
      stroke-width: 3;
      transition: fill 0.3s ease;
    }

    .status-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 50px;
      padding: 8px 16px;
      display: inline-block;
      margin-top: 4px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--yellow-color);
    }

    .seat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 16px;
    }

    .seat-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 10px 4px;
      text-align: center;
    }

    .seat-card.nay { border-color: rgba(255, 59, 92, 0.4); }
    .seat-card.yay { border-color: rgba(0, 210, 255, 0.4); }

    .seat-label {
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .seat-val {
      font-size: 1.6rem;
      font-weight: 900;
      line-height: 1;
    }

    .seat-val.nay { color: var(--red-color); }
    .seat-val.yay { color: var(--blue-color); }
    .seat-val.bal { color: var(--yellow-color); }

    /* CONTROLS TRAY */
    .tray {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tray-title {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      text-align: center;
    }

    .stepper-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stepper-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .stepper-label {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .stepper-label.nay { color: var(--red-color); }
    .stepper-label.yay { color: var(--blue-color); }

    .stepper-btn-group {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .btn-step {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      padding: 8px 0;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
    }

    .btn-step:active { transform: scale(0.95); }
    .btn-step-nay { border-color: rgba(255, 59, 92, 0.4); color: var(--red-color); }
    .btn-step-yay { border-color: rgba(0, 210, 255, 0.4); color: var(--blue-color); }

    .preset-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .btn-preset {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-muted);
      padding: 6px 2px;
      font-size: 0.65rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-preset:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="main-title">
        <!-- Electric Blue Thumbs Up Icon -->
        <svg class="title-icon icon-up" viewBox="0 0 24 24">
          <path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.58 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/>
        </svg>
        <span><span class="usa-u">U</span><span class="usa-s">S</span><span class="usa-a">A</span></span>
        <!-- Crimson Red Thumbs Down Icon -->
        <svg class="title-icon icon-down" viewBox="0 0 24 24">
          <path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.36-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/>
        </svg>
      </div>
      <div class="subtitle">U.S. Senate Tracker</div>
    </header>

    <div class="gauge-card">
      <svg class="gauge-svg" viewBox="0 0 300 230">
        <defs>
          <!-- SEAMLESS GRADIENT DEFINITION -->
          <linearGradient id="meterGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ff3b5c" />
            <stop offset="44%" stop-color="#ff3b5c" />
            <stop offset="50%" stop-color="#ffcc00" />
            <stop offset="56%" stop-color="#00d2ff" />
            <stop offset="100%" stop-color="#00d2ff" />
          </linearGradient>
        </defs>

        <!-- Overhead 51 Majority Marker -->
        <text x="150" y="20" class="majority-badge" text-anchor="middle">51 MAJORITY</text>
        <line x1="150" y1="24" x2="150" y2="38" class="majority-line" />

        <!-- Gauge Background Arc -->
        <path d="M 40,160 A 110,110 0 0,1 260,160" class="arc-bg" />

        <!-- SINGLE UNIFIED GRADIENT ARC -->
        <path d="M 40,160 A 110,110 0 0,1 260,160" class="arc-gradient-fill" />

        <!-- Major Ticks -->
        <line x1="40" y1="160" x2="52" y2="160" class="tick-major" />
        <line x1="150" y1="50" x2="150" y2="62" class="tick-major" />
        <line x1="260" y1="160" x2="248" y2="160" class="tick-major" />

        <!-- Centered Labels Under Arc Sections -->
        <text x="45" y="195" class="gauge-text-nay" text-anchor="middle">US-NAY</text>
        <text x="255" y="195" class="gauge-text-yay" text-anchor="middle">US-YAY</text>

        <!-- Dynamic Gauge Needle -->
        <line id="needle" x1="150" y1="160" x2="150" y2="65" class="needle" style="transform: rotate(0deg);" />
        <circle cx="150" cy="160" r="10" id="needleHub" class="needle-hub" />
      </svg>

      <!-- Central Status Pill -->
      <div id="statusPill" class="status-pill">TOSS-UP / EVEN (50-50)</div>

      <!-- Integrated Seat Counters -->
      <div class="seat-grid">
        <div class="seat-card nay">
          <div class="seat-label">US-NAY</div>
          <div id="nayCount" class="seat-val nay">50</div>
        </div>
        <div class="seat-card">
          <div class="seat-label">NET BAL</div>
          <div id="balCount" class="seat-val bal">EVEN</div>
        </div>
        <div class="seat-card yay">
          <div class="seat-label">US-YAY</div>
          <div id="yayCount" class="seat-val yay">50</div>
        </div>
      </div>
    </div>

    <!-- Live Test Controls -->
    <div class="tray">
      <div class="tray-title">Live 1-Seat Simulator</div>

      <!-- Steppers for Individual Seat Shifts -->
      <div class="stepper-row">
        <div class="stepper-box">
          <div class="stepper-label nay">US-NAY Seats</div>
          <div class="stepper-btn-group">
            <button class="btn-step btn-step-nay" onclick="adjustSeat('nay', -1)">-1</button>
            <button class="btn-step btn-step-nay" onclick="adjustSeat('nay', 1)">+1</button>
          </div>
        </div>

        <div class="stepper-box">
          <div class="stepper-label yay">US-YAY Seats</div>
          <div class="stepper-btn-group">
            <button class="btn-step btn-step-yay" onclick="adjustSeat('yay', -1)">-1</button>
            <button class="btn-step btn-step-yay" onclick="adjustSeat('yay', 1)">+1</button>
          </div>
        </div>
      </div>

      <!-- Quick Preset Shortcuts -->
      <div class="preset-group">
        <button class="btn-preset" onclick="setSeats(52, 48)">52-48 NAY</button>
        <button class="btn-preset" onclick="setSeats(50, 50)">50-50 EVEN</button>
        <button class="btn-preset" onclick="setSeats(48, 52)">48-52 YAY</button>
      </div>
    </div>
  </div>

  <script>
    let currentNay = 50;
    let currentYay = 50;

    function adjustSeat(type, delta) {
      if (type === 'yay') {
        currentYay = Math.max(0, Math.min(100, currentYay + delta));
        currentNay = 100 - currentYay;
      } else {
        currentNay = Math.max(0, Math.min(100, currentNay + delta));
        currentYay = 100 - currentYay;
      }
      renderUI();
    }

    function setSeats(nay, yay) {
      currentNay = nay;
      currentYay = yay;
      renderUI();
    }

    function renderUI() {
      document.getElementById('nayCount').innerText = currentNay;
      document.getElementById('yayCount').innerText = currentYay;

      const diff = currentYay - currentNay;
      const balEl = document.getElementById('balCount');
      const pillEl = document.getElementById('statusPill');
      const hubEl = document.getElementById('needleHub');

      if (diff > 0) {
        balEl.innerText = `+${diff} YAY`;
        balEl.className = 'seat-val yay';
        hubEl.style.fill = 'var(--blue-color)';
      } else if (diff < 0) {
        balEl.innerText = `+${Math.abs(diff)} NAY`;
        balEl.className = 'seat-val nay';
        hubEl.style.fill = 'var(--red-color)';
      } else {
        balEl.innerText = 'EVEN';
        balEl.className = 'seat-val bal';
        hubEl.style.fill = 'var(--yellow-color)';
      }

      // ACCELERATED ROTATION: 5.2 degrees per seat difference with visible bounce
      const rawAngle = diff * 5.2;
      const angle = Math.max(-80, Math.min(80, rawAngle));
      document.getElementById('needle').style.transform = `rotate(${angle}deg)`;

      if (diff >= 10) {
        pillEl.innerText = 'US-YAY SOLID MAJORITY';
        pillEl.style.color = 'var(--blue-color)';
      } else if (diff > 0) {
        pillEl.innerText = `LEAN US-YAY (+${diff})`;
        pillEl.style.color = 'var(--blue-color)';
      } else if (diff <= -10) {
        pillEl.innerText = 'US-NAY SOLID MAJORITY';
        pillEl.style.color = 'var(--red-color)';
      } else if (diff < 0) {
        pillEl.innerText = `LEAN US-NAY (+${Math.abs(diff)})`;
        pillEl.style.color = 'var(--red-color)';
      } else {
        pillEl.innerText = 'TOSS-UP / EVEN (50-50)';
        pillEl.style.color = 'var(--yellow-color)';
      }
    }

    renderUI();
  </script>
</body>
</html>
