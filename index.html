<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>US-YAY</title>
<!-- Apple iOS Home Screen Icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png">

  <!-- Android / Chrome Home Screen Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon.png">

  <!-- Mobile Web App Capable Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="US-YAY">	
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #121a2b;
      --border-color: rgba(255, 255, 255, 0.12);
      --red-color: #ff3b5c;
      --blue-color: #00d2ff;
      --yellow-color: #ffcc00;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      text-align: center;
      padding: 12px 0 4px;
    }

    /* RED, WHITE, AND BLUE USA TITLE */
    .main-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .usa-u { color: var(--red-color); }
    .usa-s { color: #ffffff; }
    .usa-a { color: var(--blue-color); }

    .title-icon {
      width: 32px;
      height: 32px;
      display: inline-block;
      vertical-align: middle;
    }

    .icon-up { fill: var(--blue-color); }
    .icon-down { fill: var(--red-color); }

    .subtitle {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
    }

    .gauge-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 16px 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .gauge-svg {
      width: 100%;
      height: auto;
      max-height: 290px;
      overflow: visible;
    }

    .arc-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 22;
      stroke-linecap: round;
    }

    /* UNIFIED GRADIENT ARC STYLING */
    .arc-gradient-fill {
      fill: none;
      stroke: url(#meterGradient);
      stroke-width: 22;
      stroke-linecap: round;
    }

    .tick-major {
      stroke: rgba(255, 255, 255, 0.8);
      stroke-width: 3;
    }

    .gauge-text-nay {
      fill: var(--red-color);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .gauge-text-yay {
      fill: var(--blue-color);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .majority-badge {
      fill: var(--yellow-color);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .majority-line {
      stroke: var(--yellow-color);
      stroke-width: 2;
      stroke-dasharray: 3, 3;
    }

    /* ELASTIC SPRING BOUNCE TRANSITION */
    .needle {
      stroke: var(--text-main);
      stroke-width: 4;
      stroke-linecap: round;
      transition: transform 0.6s cubic-bezier(0.34, 1.8, 0.64, 1);
      transform-origin: 150px 160px;
    }

    .needle-hub {
      fill: var(--yellow-color);
      stroke: var(--bg-color);
      stroke-width: 3;
      transition: fill 0.3s ease;
    }

    .status-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 50px;
      padding: 8px 16px;
      display: inline-block;
      margin-top: 4px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--yellow-color);
    }

    .seat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 16px;
    }

    .seat-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 10px 4px;
      text-align: center;
    }

    .seat-card.nay { border-color: rgba(255, 59, 92, 0.4); }
    .seat-card.yay { border-color: rgba(0, 210, 255, 0.4); }

    .seat-label {
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .seat-val {
      font-size: 1.6rem;
      font-weight: 900;
      line-height: 1;
    }

    .seat-val.nay { color: var(--red-color); }
    .seat-val.yay { color: var(--blue-color); }
    .seat-val.bal { color: var(--yellow-color); }

    /* CONTROLS TRAY */
    .tray {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tray-title {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      text-align: center;
    }

    .stepper-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stepper-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .stepper-label {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .stepper-label.nay { color: var(--red-color); }
    .stepper-label.yay { color: var(--blue-color); }

    .stepper-btn-group {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .btn-step {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      padding: 8px 0;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
    }

    .btn-step:active { transform: scale(0.95); }
    .btn-step-nay { border-color: rgba(255, 59, 92, 0.4); color: var(--red-color); }
    .btn-step-yay { border-color: rgba(0, 210, 255, 0.4); color: var(--blue-color); }

    .preset-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .btn-preset {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-muted);
      padding: 6px 2px;
      font-size: 0.65rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-preset:active { transform: scale(0.96); }

    /* COMPACT SOUND TOGGLE STYLES */
.sound-toggle-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 12px;
}

.toggle-label {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 1px;
  color: rgb(255, 208, 0);
}

/* The Switch Container */
.switch {
  position: relative;
  display: inline-block;
  width: 38px;
  height: 20px;
}

/* Hide default browser checkbox */
.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

/* The Slider Track */
.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(255, 255, 255, 0.2);
  transition: 0.3s ease;
  border-radius: 20px;
}

/* The Slider Knob */
.slider:before {
  position: absolute;
  content: "";
  height: 14px;
  width: 14px;
  left: 3px;
  bottom: 3px;
  background-color: #ffffff;
  transition: 0.3s ease;
  border-radius: 50%;
}

/* Checked State (Active / Green or Accent Color) */
input:checked + .slider {
  background-color: #10b981; /* Soft emerald green for ON */
}

input:checked + .slider:before {
  transform: translateX(18px);
}
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="main-title">
        <!-- Electric Blue Thumbs Up Icon -->
        <svg class="title-icon icon-up" viewBox="0 0 24 24">
          <path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.58 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/>
        </svg>
        <span><span class="usa-u">U</span><span class="usa-s">S</span><span class="usa-a">A</span></span>
        <!-- Crimson Red Thumbs Down Icon -->
        <svg class="title-icon icon-down" viewBox="0 0 24 24">
          <path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.36-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/>
        </svg>
      </div>
      <div class="subtitle">U.S. Senate Tracker</div>
    </header>

    <div class="gauge-card">
      <svg class="gauge-svg" viewBox="0 0 300 230">
        <defs>
          <!-- SEAMLESS GRADIENT DEFINITION -->
          <linearGradient id="meterGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ff3b5c" />
            <stop offset="44%" stop-color="#ff3b5c" />
            <stop offset="50%" stop-color="#ffcc00" />
            <stop offset="56%" stop-color="#00d2ff" />
            <stop offset="100%" stop-color="#00d2ff" />
          </linearGradient>
        </defs>

        <!-- Overhead EVEN -->
        <text x="150" y="20" class="majority-badge" text-anchor="middle">EVEN</text>
        <line x1="150" y1="24" x2="150" y2="38" class="majority-line" />

        <!-- Gauge Background Arc -->
        <path d="M 40,160 A 110,110 0 0,1 260,160" class="arc-bg" />

        <!-- SINGLE UNIFIED GRADIENT ARC -->
        <path d="M 40,160 A 110,110 0 0,1 260,160" class="arc-gradient-fill" />

        <!-- Major Ticks -->
        <line x1="40" y1="160" x2="52" y2="160" class="tick-major" />
        <line x1="150" y1="50" x2="150" y2="62" class="tick-major" />
        <line x1="260" y1="160" x2="248" y2="160" class="tick-major" />

        <!-- Centered Labels Under Arc Sections -->
        <text x="45" y="195" class="gauge-text-nay" text-anchor="middle">US-NAY</text>
        <text x="255" y="195" class="gauge-text-yay" text-anchor="middle">US-YAY</text>

        <!-- Dynamic Gauge Needle -->
        <line id="needle" x1="150" y1="160" x2="150" y2="65" class="needle" style="transform: rotate(0deg);" />
        <circle cx="150" cy="160" r="10" id="needleHub" class="needle-hub" />
      </svg>

      <!-- Compact Sound Toggle Switch -->
        <div class="sound-toggle-wrapper">
        <span class="toggle-label">AUDIO</span>
        <label class="switch">
    <input type="checkbox" id="soundToggle" checked onchange="toggleSound()">
    <span class="slider round"></span>
  </label>
</div>

      <!-- Central Status Pill -->
      <div id="statusPill" class="status-pill">TOSS-UP / EVEN (50-50)</div>

      <!-- Integrated Seat Counters -->
      <div class="seat-grid">
        <div class="seat-card nay">
          <div class="seat-label">US-NAY</div>
          <div id="nayCount" class="seat-val nay">50</div>
        </div>
        <div class="seat-card">
          <div class="seat-label">CUSHION</div>
          <div id="balCount" class="seat-val bal">EVEN</div>
        </div>
        <div class="seat-card yay">
          <div class="seat-label">US-YAY</div>
          <div id="yayCount" class="seat-val yay">50</div>
        </div>
      </div>
    </div>

    <!-- Live Test Controls -->
    <div class="tray">
      <div class="tray-title">Live 1-Seat Simulator</div>

      <!-- Steppers for Individual Seat Shifts -->
      <div class="stepper-row">
        <div class="stepper-box">
          <div class="stepper-label nay">US-NAY Seats</div>
          <div class="stepper-btn-group">
            <button class="btn-step btn-step-nay" onclick="adjustSeat('nay', -1)">-1</button>
            <button class="btn-step btn-step-nay" onclick="adjustSeat('nay', 1)">+1</button>
          </div>
        </div>

        <div class="stepper-box">
          <div class="stepper-label yay">US-YAY Seats</div>
          <div class="stepper-btn-group">
            <button class="btn-step btn-step-yay" onclick="adjustSeat('yay', -1)">-1</button>
            <button class="btn-step btn-step-yay" onclick="adjustSeat('yay', 1)">+1</button>
          </div>
        </div>
      </div>

      <!-- Quick Preset Shortcuts -->
      <div class="preset-group">
        <button class="btn-preset" onclick="setSeats(52, 48)">52-48 NAY</button>
        <button class="btn-preset" onclick="setSeats(50, 50)">50-50 EVEN</button>
        <button class="btn-preset" onclick="setSeats(48, 52)">48-52 YAY</button>
      </div>
    </div>
  </div>

  <script>
    let currentNay = 50;
    let currentYay = 50;
    let prevNay = null;
    let prevYay = null;
    let soundEnabled = true;

    // Load custom MP3s from root folder
    const yayAudio = new Audio('yay.mp3');
    const nayAudio = new Audio('nay.mp3');

    function toggleSound() {
      const toggle = document.getElementById('soundToggle');
      soundEnabled = toggle ? toggle.checked : true;
      
      if (soundEnabled) {
        // Plays ONLY the synth chime when toggling ON
        playSeatChangeAudio('synth');
      }
    }

    // DUAL AUDIO PLAYBACK (Custom MP3s with Synthesized Fallbacks)
    function playSeatChangeAudio(type) {
      if (!soundEnabled) return;

      // If it's a synth test ping, jump straight to the Web Audio tone generator
      if (type === 'synth') {
        playSynthFallback('yay');
        return;
      }

      const targetAudio = (type === 'yay') ? yayAudio : nayAudio;
      targetAudio.currentTime = 0;

      targetAudio.play().catch(() => {
        // Fallback to synth tones if MP3 files fail to load
        playSynthFallback(type);
      });
    }

    // Helper for Web Audio Synthesizer Tones
    function playSynthFallback(type) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        const playTone = (freq, startTime, duration) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + startTime);
          gain.gain.setValueAtTime(0.15, ctx.currentTime + startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + startTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + startTime);
          osc.stop(ctx.currentTime + startTime + duration);
        };

        if (type === 'yay') {
          playTone(523.25, 0, 0.15);    // High ascending tone (C5/E5)
          playTone(659.25, 0.12, 0.25);
        } else {
          playTone(440.00, 0, 0.15);    // Lower descending tone (A4/F4)
          playTone(349.23, 0.12, 0.25);
        }
      } catch (e) {}
    }

    function adjustSeat(type, delta) {
  if (type === 'yay') {
    currentYay = Math.max(0, Math.min(100, currentYay + delta));
    currentNay = 100 - currentYay;
  } else {
    currentNay = Math.max(0, Math.min(100, currentNay + delta));
    currentYay = 100 - currentNay; // Fixed to subtract currentNay from 100
  }
  renderUI();
}

function setSeats(nay, yay) {
      currentNay = nay;
      currentYay = yay;
      renderUI();
    }

    function renderUI() {
      // Trigger side-specific chime when counts update (skips on initial page load)
      if (prevYay !== null && prevNay !== null) {
        if (currentYay > prevYay) {
          playSeatChangeAudio('yay');
        } else if (currentNay > prevNay) {
          playSeatChangeAudio('nay');
        } else if (prevYay !== currentYay || prevNay !== currentNay) {
          playSeatChangeAudio('yay');
        }
      }

      prevNay = currentNay;
      prevYay = currentYay;

      document.getElementById('nayCount').innerText = currentNay;
      document.getElementById('yayCount').innerText = currentYay;

      const diff = currentYay - currentNay;
      const balEl = document.getElementById('balCount');
      const pillEl = document.getElementById('statusPill');
      const hubEl = document.getElementById('needleHub');

      // MAJORITY CUSHION CALCULATION (Threshold: 51 seats)
      if (currentNay >= 51) {
        const cushion = currentNay - 51;
        balEl.innerText = `+${cushion} NAY`;
        balEl.className = 'seat-val nay';
        hubEl.style.fill = 'var(--red-color)';
      } else if (currentYay >= 51) {
        const cushion = currentYay - 51;
        balEl.innerText = `+${cushion} YAY`;
        balEl.className = 'seat-val yay';
        hubEl.style.fill = 'var(--blue-color)';
      } else {
        // Tied or 50-50 split (no party at 51+)
        balEl.innerText = 'EVEN';
        balEl.className = 'seat-val bal';
        hubEl.style.fill = 'var(--yellow-color)';
      }

      const rawAngle = diff * 5.2;
      const angle = Math.max(-80, Math.min(80, rawAngle));
      document.getElementById('needle').style.transform = `rotate(${angle}deg)`;

      if (diff >= 10) {
        pillEl.innerText = 'US-YAY SOLID MAJORITY';
        pillEl.style.color = 'var(--blue-color)';
      } else if (diff > 0) {
        pillEl.innerText = `DEMOCRACY (+${Math.abs(diff)})`;
        pillEl.style.color = 'var(--blue-color)';
      } else if (diff <= -10) {
        pillEl.innerText = 'US-NAY SOLID MAJORITY';
        pillEl.style.color = 'var(--red-color)';
      } else if (diff < 0) {
        pillEl.innerText = `LEANING FASCIST`;
        pillEl.style.color = 'var(--red-color)';
      } else {
        pillEl.innerText = 'TOSS-UP / EVEN (50-50)';
        pillEl.style.color = 'var(--yellow-color)';
      }
    }

    // SUSPENSEFUL WOBBLE ANIMATION WITH A 2-SECOND POST-WOBBLE PAUSE
    function triggerSuspensefulSync() {
      const needle = document.getElementById('needle');
      const diff = currentYay - currentNay;
      const baseAngle = Math.max(-80, Math.min(80, diff * 5.2));

      // 1. Playful 1-second wiggle sequence
      needle.style.transform = `rotate(${baseAngle + 7}deg)`;
      setTimeout(() => { needle.style.transform = `rotate(${baseAngle - 7}deg)`; }, 150);
      setTimeout(() => { needle.style.transform = `rotate(${baseAngle + 5}deg)`; }, 300);
      setTimeout(() => { needle.style.transform = `rotate(${baseAngle - 5}deg)`; }, 450);
      setTimeout(() => { needle.style.transform = `rotate(${baseAngle + 3}deg)`; }, 600);
      setTimeout(() => { needle.style.transform = `rotate(${baseAngle - 3}deg)`; }, 750);
      setTimeout(() => { needle.style.transform = `rotate(${baseAngle + 2}deg)`; }, 900);
      
      // 2. Return needle to rest position at 1050ms
      setTimeout(() => { 
        needle.style.transform = `rotate(${baseAngle}deg)`; 
      }, 1050);

      // 3. Wait a full 2000ms (2 seconds) AFTER resting before fetching fresh data (3050ms total)
      setTimeout(() => { 
        syncWikipediaSenateCounts();
      }, 3050);
    }

    // WIKIPEDIA PARTY AFFILIATION TABLE PARSER
    async function syncWikipediaSenateCounts() {
      const apiUrl = "https://en.wikipedia.org/w/api.php?action=parse&page=List_of_current_United_States_senators&prop=text&format=json&origin=*";
      
      try {
        const response = await fetch(apiUrl);
        if (!response.ok) return;

        const data = await response.json();
        const htmlText = data.parse.text['*'];

        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, "text/html");
        
        let repSeats = 0;
        let demSeats = 0;

        const tables = doc.querySelectorAll("table.wikitable");
        
        tables.forEach(table => {
          const tableText = table.textContent.replace(/\s+/g, ' ').trim();
          if (tableText.includes("Affiliation") || tableText.includes("Party")) {
            
            let tempGop = 0;
            let tempDemInd = 0;

            const rows = table.querySelectorAll("tr");
            rows.forEach(row => {
              const rowText = row.textContent.replace(/\s+/g, ' ').trim();
              const isLeadershipOrTotal = /Leader|Whip|President|Chair|Secretary|Total/i.test(rowText);
              
              if (!isLeadershipOrTotal) {
                if (rowText.includes("Republican")) {
                  const gopMatch = rowText.match(/Republican[^\d]*(\d+)/i);
                  if (gopMatch) {
                    const val = parseInt(gopMatch[1], 10);
                    if (val > 0 && val <= 100) tempGop = val;
                  }
                }

                if (rowText.includes("Democratic")) {
                  const demMatch = rowText.match(/Democratic[^\d]*(\d+)/i);
                  if (demMatch) {
                    const val = parseInt(demMatch[1], 10);
                    if (val > 0 && val <= 100) tempDemInd += val;
                  }
                }

                if (rowText.includes("Independent")) {
                  const indMatch = rowText.match(/Independent[^\d]*(\d+)/i);
                  if (indMatch) {
                    const val = parseInt(indMatch[1], 10);
                    if (val > 0 && val <= 100) tempDemInd += val;
                  }
                }
              }
            });

            if (tempGop > 0 && tempDemInd > 0 && (tempGop + tempDemInd === 100)) {
              repSeats = tempGop;
              demSeats = tempDemInd;
            }
          }
        });

        console.log(`Parsed Live Senate Counts -> GOP/NAY: ${repSeats}, DEM+IND/YAY: ${demSeats}`);

        if (repSeats > 0 && demSeats > 0 && (repSeats + demSeats === 100)) {
          currentNay = repSeats;
          currentYay = demSeats;
          renderUI();
          console.log("Gauge successfully updated from Wikipedia!");
        }
      } catch (err) {
        console.log("Auto-sync bypassed, manual controls ready.", err);
      }
    }

    // Initial render & immediate load
    renderUI();
    syncWikipediaSenateCounts();

    // Automatically re-sync every 30 seconds, preceded by the bounce animation!
    setInterval(triggerSuspensefulSync, 30000);
  </script>
